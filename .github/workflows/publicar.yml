name: Publicar Ex Libris

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'   # cada día hacia las 6:17 (hora de Madrid en invierno)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Recoger novedades
        if: github.event_name != 'push'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: github.event_name != 'push'
        run: node scripts/fetch-news.mjs
      - name: Guardar novedades en el repositorio
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Novedades $(date -u +%F)" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
