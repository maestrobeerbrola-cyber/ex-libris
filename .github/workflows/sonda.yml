name: Sonda temporal (Ahora Qué Leo)
on:
  push:
    branches: [sonda-ahoraqueleo]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Feed de laSexta
        run: |
          UA='Mozilla/5.0 (ExLibris; lector de novedades personal)'
          C=$(curl -sL -A "$UA" -o f.xml -w '%{http_code} %{content_type}' https://www.lasexta.com/rss/8340916.xml)
          echo "::notice title=estado::$C items=$(grep -o '<item' f.xml | wc -l) bytes=$(wc -c < f.xml)"
          python3 - <<'PY'
          import re,html
          x=open('f.xml',encoding='utf-8',errors='replace').read()
          items=re.findall(r'<item>(.*?)</item>',x,re.S)
          for it in items[:4]:
              g=lambda t:(re.search(rf'<{t}[^>]*>(.*?)</{t}>',it,re.S) or [None,''])[1]
              t=re.sub(r'<!\[CDATA\[|\]\]>','',g('title')).strip()[:90]
              tags=sorted(set(re.findall(r'<([a-zA-Z:]+)[\s>/]',it)))
              img='media' if 'media:' in it else ('enclosure' if '<enclosure' in it else 'none')
              print(f"::notice title=item::{t} | {g('pubDate')[:31]} | {g('link')[:80]} | img={img} | tags={','.join(tags)[:150]}")
          PY
