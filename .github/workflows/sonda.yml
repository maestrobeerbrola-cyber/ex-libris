name: Sonda temporal (fuentes de noticias)
on:
  push:
    branches: [sonda-ahoraqueleo]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Probar la recogida de novedades
        run: |
          node scripts/fetch-news.mjs > log.txt 2>&1 || true
          echo "::notice title=log::$(grep -E '✓|✗' log.txt | tr '\n' '|' )"
          python3 - <<'PY'
          import json
          d=json.load(open('news.json'))
          for src in ['Librotea (elDiario.es)','Todoliteratura','Lecturalia','Biblioteca Virtual Miguel de Cervantes','Revista de Libros','Ahora Qué Leo (laSexta)']:
              xs=[x for x in d['items'] if x['fuente']==src]
              print(f"::notice title={src} ({len(xs)})::"+' || '.join(f"{x['fecha']} {x['categoria']} | {x['titulo'][:70]} | {x['url'][:60]} | {x['resumen'][:60]}" for x in xs[:4]))
          PY
